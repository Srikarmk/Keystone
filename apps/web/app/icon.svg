<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Keystone">
  <!--
    The stone at the crown of an arch. The wedge has to *penetrate* the band rather
    than sit on top of it — a trapezoid resting above a curve reads as a bucket on a
    rainbow, which is what the first four attempts looked like. Brass for the
    keystone and muted ink for the stones it locks between, following the rule the
    rest of the interface keeps: brass marks the load-bearing element and nothing else.
  -->
  <rect width="32" height="32" rx="7" fill="#1c1a17"/>
  <path d="M4.4 26a11.6 11.6 0 0 1 23.2 0" fill="none" stroke="#5b554b" stroke-width="5.4"/>
  <path d="M11 7.3h10l-1.9 12.5h-6.2z" fill="#d0a45c"/>
</svg>
